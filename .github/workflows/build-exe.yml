name: Build Windows EXE

on:
  push:
    branches: [main]
    paths:
      - "lotto_app/**"
      - "run.py"
      - "requirements.txt"
      - ".github/workflows/build-exe.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build exe (folder)
        run: pyinstaller --noconfirm --onedir --windowed --name LottoAnalyzer --collect-data customtkinter run.py

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist/LottoAnalyzer -DestinationPath LottoAnalyzer-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: LottoAnalyzer-windows
          path: LottoAnalyzer-windows.zip
          retention-days: 90
